name: Build Windows EXE

on:
  push:
    tags:
      - "v*"          # запускается на пуш тега вида v1.0.0
  workflow_dispatch:    # + можно запустить руками из вкладки Actions

permissions:
  contents: write        # нужно для загрузки exe в GitHub Releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # requirements-windows.txt — без dbus-next (Linux/D-Bus-only, на Windows не нужен и не соберётся)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt
          pip install pyinstaller

      - name: List installed packages
        # диагностика: если тут нет pypresence/PyQt6/mutagen — дело в requirements-windows.txt,
        # а не в PyInstaller, и следующий шаг тоже упадёт
        run: pip list

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name GlideMusic --collect-all PyQt6 --collect-all pypresence app.py

      - name: Verify build output
        run: |
          if (!(Test-Path "dist/GlideMusic.exe")) {
            Write-Error "dist/GlideMusic.exe not found"
            exit 1
          }

      # Артефакты Actions быстро упираются в квоту на приватных репо —
      # поэтому, как и в Glide-Messenger, готовый exe уходит в Release,
      # а не в actions/upload-artifact.
      - name: Upload EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GlideMusic.exe

      # Для ручных запусков (workflow_dispatch, без тега) — обычный
      # артефакт, чтобы можно было скачать exe со страницы прогона.
      - name: Upload EXE as workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: GlideMusic-windows
          path: dist/GlideMusic.exe
          retention-days: 7
